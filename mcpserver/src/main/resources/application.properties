spring.application.name=mcpserverremote

spring.datasource.url=jdbc:h2:mem:chatmemory;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

server.port=8095
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=mcpserverremote
spring.ai.mcp.server.version=1.0.0

# Streamable HTTP endpoint
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp